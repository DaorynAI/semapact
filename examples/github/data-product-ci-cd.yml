name: SemaPact - data product CI/CD

on:
  pull_request:
    paths:
      - contract.yaml
  push:
    branches:
      - main
    paths:
      - contract.yaml

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  CONTRACT_PATH: contract.yaml
  DEV_SERVER: development
  PROD_SERVER: production

jobs:
  candidate-assess:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install SemaPact
        run: pip install "semapact[databricks]"

      - name: Materialize base contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "${BASE_SHA}:${CONTRACT_PATH}" > /tmp/base-contract.yaml

      - name: Assess candidate against development
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p artifacts
          semapact deployment assess \
            --base /tmp/base-contract.yaml \
            --candidate "${CONTRACT_PATH}" \
            --base-revision-ref "git:${BASE_SHA}" \
            --candidate-revision-ref "git:${CANDIDATE_SHA}" \
            --effective-date "$(date -u +%F)" \
            --server "${DEV_SERVER}" \
            --bundle-out artifacts/candidate.bundle.json \
            --output json > artifacts/candidate.summary.json

      - name: Upload candidate assessment
        uses: actions/upload-artifact@v4
        with:
          name: semapact-candidate-assessment
          path: artifacts/

  release-assess:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install SemaPact
        run: pip install "semapact[databricks]"

      - name: Materialize previous contract
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          git show "${BASE_SHA}:${CONTRACT_PATH}" > /tmp/base-contract.yaml

      - name: Build formal release bundle
        env:
          BASE_SHA: ${{ github.event.before }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          mkdir -p artifacts
          semapact deployment assess \
            --base /tmp/base-contract.yaml \
            --candidate "${CONTRACT_PATH}" \
            --base-revision-ref "git:${BASE_SHA}" \
            --candidate-revision-ref "git:${CANDIDATE_SHA}" \
            --effective-date "$(date -u +%F)" \
            --server "${PROD_SERVER}" \
            --release \
            --bundle-out artifacts/release.bundle.json \
            --output json > artifacts/release.summary.json

      - name: Upload exact release bundle
        uses: actions/upload-artifact@v4
        with:
          name: semapact-release-bundle
          path: artifacts/

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release-assess
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
    steps:
      - name: Checkout governance ledger
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install SemaPact
        run: pip install "semapact[databricks]"

      - name: Download exact release bundle
        uses: actions/download-artifact@v4
        with:
          name: semapact-release-bundle
          path: artifacts

      # GitHub Environment is the human approval surface. Today the generic
      # approval CLI still needs the exact bundle fields projected into the
      # Git governance ledger; this is intentionally visible in the example.
      - name: Record environment approval when governance requires REVIEW
        run: |
          BUNDLE=artifacts/release.bundle.json
          if [ "$(jq -r '.decision.decision' "${BUNDLE}")" = "REVIEW" ]; then
            semapact approval record \
              --decision-id "$(jq -r '.decision.decision_id' "${BUNDLE}")" \
              --change-set-id "$(jq -r '.change_set.change_set_id' "${BUNDLE}")" \
              --release-plan-id "$(jq -r '.release_plan.release_plan_id' "${BUNDLE}")" \
              --version-resolution-id "$(jq -r '.version_resolution.version_resolution_id' "${BUNDLE}")" \
              --operation DEPLOY \
              --action APPROVE \
              --actor-reference "github-environment:production/run:${GITHUB_RUN_ID}" \
              --recorded-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --scope-reference "$(jq -r '.deployment_plan.deployment_plan_id' "${BUNDLE}")" \
              --capability-reference "github-environment:production" \
              --evidence-reference "$(jq -r '.bundle_digest' "${BUNDLE}")"
          fi

      - name: Deploy exact release bundle
        run: |
          semapact deployment deploy \
            --bundle artifacts/release.bundle.json \
            --warehouse-id "${DATABRICKS_WAREHOUSE_ID}"

      - name: Commit governance ledger
        run: |
          if [ -n "$(git status --porcelain .semapact/history 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .semapact/history
            git commit -m "chore(semapact): record contract release"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # Operational deployment history is not passed here. If configured under
      # history.operational in .semapact.yaml, deploy writes to that backend.
