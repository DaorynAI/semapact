apiVersion: v3.1.0
kind: DataContract
id: orders-contract
name: orders-contract
version: 1.0.0
status: active
domain: commerce
description:
  purpose: Multi-schema contract
schema:
  - id: orders
    name: orders
    physicalName: tbl_orders
    properties:
      - id: id
        name: id
        physicalName: col_id
        logicalType: string
        physicalType: varchar(64)
        required: true
  - id: audit_log
    name: audit_log
    physicalName: tbl_audit_log
    properties:
      - id: log_id
        name: log_id
        physicalName: col_log_id
        logicalType: string
        physicalType: varchar(64)
        required: true
