[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semapact"
version = "0.0.0"
description = "Deterministic lifecycle governance and production assurance for ODCS data contracts"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Elliot Sun" },
]
keywords = [
  "data-contract",
  "data-contracts",
  "data-governance",
  "data-products",
  "odcs",
  "schema-evolution",
  "breaking-changes",
  "gitops",
  "databricks",
  "unity-catalog",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pydantic>=2.8.0",
  "PyYAML>=6.0.0",
  "requests>=2.32.0",
  "datacontract-cli>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/DaorynAI/semapact"
Repository = "https://github.com/DaorynAI/semapact"
Issues = "https://github.com/DaorynAI/semapact/issues"
Changelog = "https://github.com/DaorynAI/semapact/blob/main/CHANGELOG.md"

[project.scripts]
semapact = "semapact.interfaces.cli:main"

[project.optional-dependencies]
sql = [
  "SQLAlchemy>=2.0.0",
  "sqlglot>=26.0.0",
  "pandas>=2.0.0",
]
delta = [
  "deltalake>=0.18.0",
  "pyarrow>=14.0.0",
  "pandas>=2.0.0",
]
quality = [
  "great_expectations>=1.0.0",
  "pandas>=2.0.0",
]
llm = [
  "openai>=1.0.0",
  "litellm>=1.83.14",
]
tui = [
  "textual>=8.2.7",
]
databricks = [
  "datacontract-cli[databricks]>=0.12.0",
  "pyspark>=3.3.0",
]
azure = [
  "azure-identity>=1.16.0",
  "azure-storage-file-datalake>=12.16.0",
]
graph = [
  "networkx>=3.0",
]
s3 = [
  "boto3>=1.34.0",
  "s3fs>=2024.3.0",
]
all = [
  "SQLAlchemy>=2.0.0",
  "sqlglot>=26.0.0",
  "pandas>=2.0.0",
  "deltalake>=0.18.0",
  "pyarrow>=14.0.0",
  "great_expectations>=1.0.0",
  "openai>=1.0.0",
  "litellm>=1.83.14",
  "textual>=8.2.7",
  "datacontract-cli[databricks]>=0.12.0",
  "pyspark>=3.3.0",
  "azure-identity>=1.16.0",
  "azure-storage-file-datalake>=12.16.0",
  "networkx>=3.0",
  "boto3>=1.34.0",
  "s3fs>=2024.3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "pytest-mock>=3.14.0",
  "networkx>=3.0",
  "types-PyYAML>=6.0.0",
  "databricks-sql-connector>=3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["semapact*"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
tag_format = "semapact-v{version}"
upload_to_pypi = false
upload_to_release = true
build_command = "uv build"
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.changelog.default_templates]
mask_initial_release = true
