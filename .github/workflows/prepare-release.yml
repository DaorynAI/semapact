name: Prepare Release

on:
  workflow_dispatch:

concurrency:
  group: semapact-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
        continue-on-error: true

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Require a non-recursive release token
        env:
          RELEASE_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PAT }}
        shell: bash
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Configure RELEASE_BOT_APP_ID/RELEASE_BOT_PRIVATE_KEY or RELEASE_PAT. Prepare Release must use a GitHub App/PAT so the generated release PR triggers normal CI."
            exit 1
          fi

      - name: Ensure no release PR is already open
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PAT }}
        shell: bash
        run: |
          count="$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("release/semapact-v"))] | length')"
          if [ "$count" != "0" ]; then
            echo "::error::A SemaPact release PR is already open. Merge or close it before preparing another release."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install release tooling
        run: uv pip install --system python-semantic-release==10.6.2

      - name: Calculate next version
        id: next
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PAT }}
        shell: bash
        run: |
          version="$(semantic-release version --print)"
          current="$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          PY
          )"

          if [ -z "$version" ] || [ "$version" = "$current" ]; then
            echo "::error::No releasable changes were detected."
            exit 1
          fi

          if [ "$current" = "0.0.0" ] && [ "$version" != "0.1.0" ]; then
            echo "::error::The first SemaPact release must be 0.1.0, but semantic-release calculated $version."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/semapact-v${version}" >/dev/null; then
            echo "::error::Tag semapact-v${version} already exists."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Preparing SemaPact $version"

      - name: Stamp version and changelog
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PAT }}
        run: semantic-release -v version --no-commit --no-tag

      - name: Verify and commit prepared release
        shell: bash
        run: |
          prepared="$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          PY
          )"
          expected="${{ steps.next.outputs.version }}"
          if [ "$prepared" != "$expected" ]; then
            echo "::error::Prepared version $prepared does not match calculated version $expected."
            exit 1
          fi

          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "::error::semantic-release did not modify any tracked release files."
            exit 1
          fi

          unexpected="$(printf '%s\n' "$changed" | grep -v -E '^(pyproject\.toml|CHANGELOG\.md)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Release preparation modified unexpected tracked files:"
            echo "$unexpected"
            exit 1
          fi

          if ! printf '%s\n' "$changed" | grep -qx 'pyproject.toml'; then
            echo "::error::Release preparation did not modify pyproject.toml."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml CHANGELOG.md
          git commit -m "chore(release): ${expected}"

          committed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          unexpected_committed="$(printf '%s\n' "$committed" | grep -v -E '^(pyproject\.toml|CHANGELOG\.md)$' || true)"
          if [ -n "$unexpected_committed" ]; then
            echo "::error::Release commit contains unexpected tracked files:"
            echo "$unexpected_committed"
            exit 1
          fi

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::Tracked release changes remain after creating the release commit."
            exit 1
          fi

      - name: Push release branch
        shell: bash
        run: |
          version="${{ steps.next.outputs.version }}"
          branch="release/semapact-v${version}"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error::Remote branch $branch already exists."
            exit 1
          fi

          git push origin "HEAD:refs/heads/$branch"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PAT }}
        shell: bash
        run: |
          version="${{ steps.next.outputs.version }}"
          branch="release/semapact-v${version}"
          body="$(cat <<EOF
          Prepare SemaPact ${version} for release.

          This PR is generated by the protected-main release workflow. It stamps the package version, updates the changelog, and has already passed the configured build + twine metadata gate during preparation.

          After normal PR CI is green, merge this PR and then run the Release workflow from main to tag, build, create the GitHub Release, and publish the exact artifacts to PyPI.
          EOF
          )"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(release): semapact-v${version}" \
            --body "$body"
