name: Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Semantic Release & Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
        continue-on-error: true

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install python-semantic-release
        run: uv pip install --system python-semantic-release

      - name: Run semantic-release version
        id: version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          before="$(git rev-parse HEAD)"
          semantic-release -v version
          after="$(git rev-parse HEAD)"

          if [ "$before" = "$after" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "No releasable changes detected."
            exit 0
          fi

          tag="$(git describe --tags --exact-match HEAD)"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=${tag#semapact-v}" >> "$GITHUB_OUTPUT"

      - name: Build package
        if: steps.version.outputs.released == 'true'
        run: uv build

      - name: Validate distribution metadata
        if: steps.version.outputs.released == 'true'
        run: uvx twine check dist/*

      - name: Publish to GitHub Releases
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: semantic-release -v publish

      - name: Upload Python distributions
        if: steps.version.outputs.released == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: python-dist-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v8
        with:
          name: python-dist-${{ needs.release.outputs.version }}
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
