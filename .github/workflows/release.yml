name: Release

on:
  workflow_dispatch:

concurrency:
  group: semapact-release
  cancel-in-progress: false

jobs:
  release:
    name: Tag, Build & Create Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify dispatched commit is current main
        shell: bash
        run: |
          git fetch origin main --tags --force
          current="$(git rev-parse HEAD)"
          dispatched="${{ github.sha }}"
          main="$(git rev-parse origin/main)"

          if [ "$current" != "$dispatched" ] || [ "$current" != "$main" ]; then
            echo "::error::main moved after this release was dispatched. Re-run Release from current main."
            echo "checked-out=$current"
            echo "dispatched=$dispatched"
            echo "current-main=$main"
            exit 1
          fi

          branch="$(git branch --show-current)"
          if [ "$branch" != "main" ]; then
            echo "::error::Release must run from an attached main branch; got '${branch:-<detached>}'."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install release tooling
        run: uv pip install --system python-semantic-release==10.6.2

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          mapfile -t head_tags < <(git tag --points-at HEAD --list 'semapact-v*')

          if [ "${#head_tags[@]}" -gt 1 ]; then
            echo "::error::Current main has multiple SemaPact release tags: ${head_tags[*]}"
            exit 1
          fi

          if [ "${#head_tags[@]}" -eq 1 ]; then
            tag="${head_tags[0]}"
            version="${tag#semapact-v}"
            echo "Resuming existing release tag $tag on current main."
          else
            version="$(semantic-release version --print)"
            if [ -z "$version" ]; then
              echo "::error::semantic-release found no releasable changes on current main."
              exit 1
            fi
            tag="semapact-v${version}"

            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              tagged="$(git rev-list -n 1 "$tag")"
              echo "::error::$tag already exists on $tagged, not current main."
              exit 1
            fi

            if ! git tag --list 'semapact-v*' | grep -q . && [ "$version" != "0.1.0" ]; then
              echo "::error::Expected first SemaPact release 0.1.0, got $version."
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "SemaPact $version"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing SemaPact $version from $(git rev-parse HEAD)"

      - name: Build exact tagged distributions
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          version="${{ steps.release.outputs.version }}"
          tagged="$(git rev-list -n 1 "$tag")"
          current="$(git rev-parse HEAD)"
          if [ "$tagged" != "$current" ]; then
            echo "::error::$tag resolves to $tagged, not checked-out commit $current."
            exit 1
          fi

          rm -rf dist
          uv build
          uvx twine check dist/*

          test -f "dist/semapact-${version}.tar.gz" || {
            echo "::error::Missing semapact-${version}.tar.gz; SCM-derived sdist version is wrong."
            ls -la dist
            exit 1
          }

          wheel_count="$(find dist -maxdepth 1 -type f -name "semapact-${version}-*.whl" | wc -l)"
          if [ "$wheel_count" != "1" ]; then
            echo "::error::Expected exactly one semapact-${version} wheel, found $wheel_count."
            ls -la dist
            exit 1
          fi

      - name: Push release tag
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          current="$(git rev-parse HEAD)"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            remote="$(git ls-remote --tags origin "refs/tags/$tag^{}" | awk '{print $1}')"
            if [ -z "$remote" ]; then
              remote="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
            fi
            if [ "$remote" != "$current" ]; then
              echo "::error::Remote $tag does not resolve to current main $current."
              exit 1
            fi
            echo "$tag already exists remotely on current main; resuming."
          else
            git push origin "$tag"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          version="${{ steps.release.outputs.version }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --verify-tag \
              --title "SemaPact $version" \
              --generate-notes
          fi

      - name: Upload Python distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-dist-${{ steps.release.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v8
        with:
          name: python-dist-${{ needs.release.outputs.version }}
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
