name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_NO_PROGRESS: "1"
      SEMAPACT_RUNTIME_CONTEXT: "auto"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras --group dev --frozen

      - name: Run static checks
        run: uvx ruff check . --select E9,F63,F7,F82

      - name: Run tests
        run: uv run pytest

      - name: Verify package build
        run: uv build

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_NO_PROGRESS: "1"
      SEMAPACT_RUNTIME_CONTEXT: "auto"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras --group dev --frozen

      - name: Run tests with coverage
        run: >-
          uv run --with pytest-cov pytest
          --cov=semapact
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          echo "## Test Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .coverage ]; then
            uv run --with coverage coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Coverage data was not generated._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
          retention-days: 14
