name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_NO_PROGRESS: "1"
      SEMAPACT_RUNTIME_CONTEXT: "auto"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras --group dev --frozen

      - name: Run static checks
        run: uvx ruff check . --select E9,F63,F7,F82

      - name: Run tests
        run: uv run pytest

      - name: Verify package build
        run: uv build

  package-smoke:
    name: minimal-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_NO_PROGRESS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build distribution
        run: uv build

      - name: Validate distribution metadata
        run: uvx twine check dist/*

      - name: Install wheel without optional extras
        run: |
          uv venv --python 3.12 .venv-smoke
          uv pip install --python .venv-smoke/bin/python dist/semapact-*.whl

      - name: Verify core imports and CLI
        run: |
          .venv-smoke/bin/python -c "import semapact; from semapact import ContractLoader, ContractMergeEngine; from semapact.governance import GovernanceDecision; from semapact.reconciliation import reconcile_governed_contract; print(semapact.__name__, ContractLoader.__name__, ContractMergeEngine.__name__, GovernanceDecision.__name__, reconcile_governed_contract.__name__)"
          .venv-smoke/bin/semapact --help

  release-config:
    name: semantic-release-config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install pinned semantic-release
        run: uv pip install --system python-semantic-release==10.6.2

      - name: Validate semantic-release calculation
        shell: bash
        run: |
          git checkout -B main
          next="$(semantic-release version --print)"

          if ! git tag --list 'semapact-v*' | grep -q .; then
            if [ "$next" != "0.1.0" ]; then
              echo "::error::Expected first SemaPact release 0.1.0, got '${next:-<none>}'."
              exit 1
            fi
            echo "First SemaPact release correctly resolves to $next."
          else
            echo "semantic-release next version: ${next:-<no releasable changes>}"
          fi

      - name: Validate tag-derived package version
        shell: bash
        run: |
          test_tag="semapact-v9.9.9"
          git tag "$test_tag"
          trap 'git tag -d "$test_tag" >/dev/null 2>&1 || true' EXIT

          rm -rf dist
          uv build
          uvx twine check dist/*

          test -f dist/semapact-9.9.9.tar.gz || {
            echo "::error::setuptools-scm did not derive sdist version 9.9.9 from $test_tag."
            ls -la dist
            exit 1
          }

          wheel_count="$(find dist -maxdepth 1 -type f -name 'semapact-9.9.9-*.whl' | wc -l)"
          if [ "$wheel_count" != "1" ]; then
            echo "::error::Expected exactly one semapact-9.9.9 wheel, found $wheel_count."
            ls -la dist
            exit 1
          fi

  databricks-extra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_NO_PROGRESS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Create isolated environment
        run: uv venv

      - name: Install SemaPact Databricks extra from project metadata
        run: uv pip install --python .venv/bin/python -e ".[databricks]" pytest

      - name: Verify Databricks SDK read-side boundaries
        run: >-
          .venv/bin/python -c
          "import inspect; from databricks.sdk import WorkspaceClient; from databricks.sdk.service.catalog import TableInfo, TablesAPI; from semapact.platforms.databricks import create_databricks_workspace_client, discover_databricks_tables; client_params = inspect.signature(WorkspaceClient).parameters; list_params = inspect.signature(TablesAPI.list).parameters; assert {'host', 'token', 'profile'} <= set(client_params); assert {'catalog_name', 'schema_name'} <= set(list_params); print(WorkspaceClient.__name__, TableInfo.__name__, create_databricks_workspace_client.__name__, discover_databricks_tables.__name__)"

      - name: Run Databricks read-side tests with official SDK installed
        run: >-
          .venv/bin/python -m pytest
          tests/test_databricks_client.py
          tests/test_databricks_discovery.py
          tests/test_observation_databricks.py

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_NO_PROGRESS: "1"
      SEMAPACT_RUNTIME_CONTEXT: "auto"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras --group dev --frozen

      - name: Run tests with coverage
        run: >-
          uv run --with pytest-cov pytest
          --cov=semapact
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov

      - name: Publish module coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f coverage.xml ]; then
            uv run python .github/scripts/coverage_summary.py coverage.xml | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "## Test Coverage" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "_Coverage data was not generated._" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
          retention-days: 14
